# Render blueprint for the BIDit BACKEND + Postgres.
# (The web app is deployed separately on Vercel — see docs/DEPLOY.md.)
#
# Why not the free plan: the backend must stay always-on — it holds live
# WebSocket connections and runs the auction/deposit/giveaway background loops.
# Render's free web services sleep on inactivity, which would drop sockets and
# stop detecting deposits. Use "starter" (or bump as needed).

databases:
  - name: bidit-db
    databaseName: bidit
    plan: basic-256mb # smallest paid; a friends test fits easily
    postgresMajorVersion: "17"

services:
  - type: web
    name: bidit-backend
    runtime: node
    plan: starter # always-on required for WebSockets + background pollers
    healthCheckPath: /
    # deploy:push runs `prisma db push --accept-data-loss`: db push (no migration
    # files) is this repo's only schema mechanism, and without the flag Prisma
    # refuses ANY warning-class change (e.g. adding a unique index) in a
    # non-interactive build. The flag means DESTRUCTIVE schema edits apply
    # without a prompt — review schema.prisma diffs before merging, and for
    # column drops/renames on real data do a manual, verified push instead.
    buildCommand: npm install && npm run prisma:generate -w @bidit/backend && npm run deploy:push -w @bidit/backend
    startCommand: npm run start -w @bidit/backend
    envVars:
      # install devDeps (tsx + prisma are needed to build/run) and pin Node
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bidit-db
          property: connectionString
      # ---- app config (safe to commit) ----
      # This value WINS over the Render dashboard: every blueprint sync re-applies
      # it, so editing the mode in the dashboard alone gets silently reverted on
      # the next render.yaml change. Change it here.
      - key: BIDIT_PAYOUT_MODE
        value: escrow # hold funds in escrow, 5% platform fee (direct = pay seller 100%, no fee)
      - key: SOLANA_CLUSTER
        value: mainnet-beta
      - key: BIDIT_ALLOW_MAINNET
        value: "yes"
      - key: USDC_MINT
        value: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v # mainnet USDC
      # In production the API only accepts browser requests from these origins
      # (comma-separated). MUST include your Vercel web origin or the site can't
      # call the API. Example: https://bidit.vercel.app,https://www.bidit.app
      - key: BIDIT_ALLOWED_ORIGINS
        sync: false
      - key: BIDIT_PROMO_START
        value: "2026-07-14T00:00:00-06:00" # "$100 to sell" promo opens (3-day enrollment window). Remove/blank to disable.
      # Seller coin auto-create ("<handle>'s BIDit Livestream"). Links inside the
      # coin's pump.fun metadata point here — set to the public web origin.
      - key: BIDIT_WEB_ORIGIN
        sync: false # e.g. https://your-site.vercel.app (falls back to the first BIDIT_ALLOWED_ORIGINS entry)
      # Optional override: BIDIT_PUMP_PROVIDER=offchain|pumpportal|mock|mock-offchain.
      # Default is `offchain` on mainnet (free, no wallet warning — sellers sign a
      # pump.fun sign-in message, we create the coin through pump.fun's own API)
      # and a mock everywhere else. `pumpportal` is the on-chain escape hatch: it
      # works but costs network fees and makes wallets show a scary-transaction
      # warning, so leave it unset unless the off-chain path breaks.
      # BIDIT_PUMP_PRIORITY_FEE_SOL (default 0.0001) applies to pumpportal only.
      # ---- secrets: set these in the Render dashboard, never commit ----
      # The server REFUSES TO BOOT on mainnet (or BIDIT_ENV=production) if any of
      # these are missing/weak — see src/config.ts (assertStartupConfig).
      - key: SOLANA_RPC
        sync: false # your mainnet RPC (Helius/QuickNode). If unset, a mock chain is used — which the guard rejects in prod.
      - key: TREASURY_SECRET
        sync: false # treasury keypair (base58 or JSON array) — hot wallet
      # Escrow-mode wallets. In direct-payout mode they're unused and each falls
      # back to treasury; for escrow they MUST be distinct keypairs or the on-chain
      # legs become self-transfers (see docs/ESCROW-DESIGN.md).
      - key: ESCROW_SECRET
        sync: false # holds each order's item price between lock and release/refund
      - key: BUYBACK_SECRET
        sync: false # accumulates the 4% buyback cut
      - key: FEE_SECRET
        sync: false # collects the 1% operator fee + all shipping fees
      - key: BIDIT_WALLET_SEED
        sync: false # strong, unique, backed up (≥24 chars) — controls all deposit addresses
      - key: AUTH_SECRET
        sync: false # REQUIRED: strong random string (≥32 chars) for session tokens. Generate: `openssl rand -base64 48`
      - key: BIDIT_PII_KEY
        sync: false # encrypts shipping addresses at rest (≥16 chars). Generate: `openssl rand -base64 32`. Keep it STABLE — losing it makes encrypted addresses unreadable.
      - key: SHIPPO_API_KEY
        sync: false # Shippo tracking → delivery detection. If unset, delivery comes from buyer-confirm / admin instead of automatic tracking.
